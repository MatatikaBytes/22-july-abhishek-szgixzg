      "name": "hard_delete",
      "kind": "boolean",
      "value": false,
      "label": "Hard Delete",
      "description": "Hard delete records.",
      "hidden": false,
      "sensitive": false,
      "configured": false,
      "protected": false
    },
    {
      "name": "ingestion_method",
      "kind": "options",
      "value": "file_staging",
      "label": "Ingestion Method",
      "description": "How records are loaded into Snowflake. 'file_staging' (default) stages local batch files and loads them with COPY INTO/MERGE INTO, per `load_method`; this requires a running warehouse. 'snowpipe_streaming' ingests rows directly via the Snowpipe Streaming API, with no warehouse required and billing based on data ingested. Only key-pair authentication is supported in this mode, and `hard_delete` is not supported. `load_method: overwrite` truncates via a regular SQL connection before streaming begins, same as with `file_staging`. `load_method: upsert` needs MERGE, which streaming doesn't support, so any individual stream with key properties falls back to `file_staging` for that stream only (with a logged warning) rather than failing the whole sync -- other streams keep streaming.",
      "options": [
        {
          "label": "File Staging",
          "value": "file_staging"
        },
        {
          "label": "Snowpipe Streaming",
          "value": "snowpipe_streaming"
        }
      ],
      "hidden": false,
      "sensitive": false,
      "configured": false,
      "protected": false
    },
    {
      "name": "load_method",
      "kind": "options",
      "value": "upsert",
      "label": "Load Method",
      "description": "Controls how records are written to the destination table. 'append-only' always uses COPY INTO, writing every input record as a new row regardless of key properties, without merging or truncating. 'upsert' (default) uses MERGE INTO, matching on key properties to update existing rows and insert new ones. 'overwrite' truncates the table then uses COPY INTO, replacing all existing rows \u2014 faster for initial loads but destructive if run on a populated table.",
      "options": [
        {
          "label": "Append Only",
          "value": "append-only"
        },
        {
          "label": "Upsert",
          "value": "upsert"
        },
        {
          "label": "Overwrite",
          "value": "overwrite"
        }
      ],
      "hidden": false,
      "sensitive": false,
      "configured": false,
      "protected": false
    },
